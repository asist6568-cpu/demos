<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de DNI - PeruAPI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f9fafb;
    }

    .header p {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 4px;
    }

    .form-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #f9fafb;
      font-size: 1rem;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 20px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .alert {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .results {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .field {
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }

    .field:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .field:first-child {
      padding-top: 0;
    }

    .label {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .value {
      font-size: 1.05rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .raw-data {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #64748b;
      cursor: pointer;
      text-align: right;
    }

    pre {
      background: #030712;
      border: 1px solid #1f2937;
      padding: 12px;
      border-radius: 8px;
      color: #34d399;
      font-size: 0.75rem;
      overflow-x: auto;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Consulta RENIEC</h1>
      <p>Ingresa un número de DNI para obtener los datos oficiales.</p>
    </div>

    <div class="form-group">
      <input 
        type="text" 
        id="dniInput" 
        placeholder="DNI (8 dígitos)" 
        maxlength="8"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
        onkeydown="if(event.key === 'Enter') consultarDNI()"
      >
      <button id="btnBuscar" onclick="consultarDNI()">Buscar</button>
    </div>

    <div id="errorBox" class="alert"></div>

    <div id="resultBox" class="results">
      <div class="field">
        <div class="label">Nombres</div>
        <div class="value" id="resNombres">-</div>
      </div>
      <div class="field">
        <div class="label">Apellidos</div>
        <div class="value" id="resApellidos">-</div>
      </div>
      <div class="field">
        <div class="label">DNI / Dígito Verificador</div>
        <div class="value" id="resDni">-</div>
      </div>

      <div class="raw-data" onclick="toggleRaw()">Ver respuesta JSON ▼</div>
      <pre id="rawJson"></pre>
    </div>
  </div>

  <script>
    async function consultarDNI() {
      const input = document.getElementById('dniInput');
      const btn = document.getElementById('btnBuscar');
      const box = document.getElementById('resultBox');
      const error = document.getElementById('errorBox');
      const raw = document.getElementById('rawJson');
      const dni = input.value.trim();

      error.style.display = 'none';
      box.style.display = 'none';
      raw.style.display = 'none';

      if (dni.length !== 8) {
        error.textContent = 'El DNI debe tener exactamente 8 dígitos.';
        error.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Buscando...';

      try {
        const response = await fetch(`/api/dni?dni=${dni}`);
        const data = await response.json();

        if (response.ok && (data.code === '200' || data.success || data.nombres)) {
          document.getElementById('resNombres').textContent = data.nombres || '-';
          
          const apePaterno = data.apellido_paterno || '';
          const apeMaterno = data.apellido_materno || '';
          document.getElementById('resApellidos').textContent = `${apePaterno} ${apeMaterno}`.trim() || '-';

          const digito = data.dv !== undefined ? ` (DV: ${data.dv})` : '';
          document.getElementById('resDni').textContent = `${data.dni || dni}${digito}`;

          raw.textContent = JSON.stringify(data, null, 2);
          box.style.display = 'block';
        } else {
          error.textContent = data.mensaje || data.error || 'No se encontraron resultados para ese DNI.';
          error.style.display = 'block';
        }
      } catch (err) {
        error.textContent = 'No se pudo conectar con el servidor. Intenta de nuevo.';
        error.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Buscar';
      }
    }

    function toggleRaw() {
      const raw = document.getElementById('rawJson');
      raw.style.display = raw.style.display === 'block' ? 'none' : 'block';
    }
  </script>

</body>
</html>
