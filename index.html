<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consulta DNI</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 40px; display: flex; justify-content: center; }
    .box { background: #1e293b; padding: 20px; border-radius: 8px; width: 400px; }
    input, button { padding: 10px; border-radius: 4px; border: none; font-size: 1rem; }
    input { width: 65%; margin-right: 5px; background: #334155; color: #fff; }
    button { background: #0284c7; color: #fff; cursor: pointer; }
    pre { background: #000; padding: 12px; border-radius: 6px; overflow-x: auto; color: #38bdf8; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="box">
    <h3>Consulta DNI</h3>
    <input type="text" id="dniInput" placeholder="DNI (8 dígitos)" maxlength="8">
    <button onclick="buscar()">Consultar</button>
    <pre id="output">// Resultado aquí...</pre>
  </div>

  <script>
    async function buscar() {
      const dni = document.getElementById('dniInput').value.trim();
      const output = document.getElementById('output');

      if (dni.length !== 8) {
        output.textContent = 'Ingresa un DNI de 8 dígitos.';
        return;
      }

      output.textContent = 'Consultando...';

      try {
        // Llama a la Serverless Function
        const res = await fetch(`/api/dni?dni=${dni}`);
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = 'Error: ' + err.message;
      }
    }
  </script>

</body>
</html>
